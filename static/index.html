<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words · Vocabulary Trainer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div>
          <h1>Words</h1>
          <p class="brand-sub">Vocabulary Trainer</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button
          class="btn ghost sidebar-toggle"
          id="btn-toggle-sidebar"
          aria-controls="lexicon-sidebar"
          aria-expanded="false"
        >
          Dictionary
        </button>
      </div>
    </header>

    <main class="content">
      <!-- ============================ QUIZ VIEW ============================ -->
      <section class="view active" id="view-quiz">
        <div class="panel setup-panel" id="quiz-setup">
          <div class="setup-heading">
            <span class="setup-eyebrow">VOCABULARY PRACTICE</span>
            <div class="setup-title-row">
              <h2>Build your next quiz</h2>
              <span class="pool-info" id="pool-info" aria-live="polite">0 words available</span>
            </div>
            <p>Choose how many words to practice and how you want to be challenged.</p>
          </div>
          <div class="setup-grid">
            <label class="field question-count-field" for="opt-no">
              <span>Number of questions</span>
              <div class="number-input-wrap">
                <input type="number" id="opt-no" value="30" min="1" max="999" inputmode="numeric" />
                <span class="number-suffix">questions</span>
              </div>
            </label>
            <div class="mode-start-row">
              <fieldset class="field mode-field">
                <legend>Quiz mode</legend>
                <div class="mode-toggle" role="radiogroup" aria-label="Quiz mode">
                  <label class="mode-option">
                    <input type="radio" name="quiz-mode" value="classic" checked />
                    <span>Definition</span>
                  </label>
                  <label class="mode-option">
                    <input type="radio" name="quiz-mode" value="similar" />
                    <span>Similar words</span>
                  </label>
                </div>
              </fieldset>
              <button class="btn primary" id="btn-start">Start quiz <span aria-hidden="true">→</span></button>
            </div>
          </div>
        </div>

        <div class="panel quiz-panel" id="quiz-panel" hidden>
          <div class="quiz-head">
            <button class="btn ghost small quiz-back" id="btn-back" aria-label="Back to quiz setup">← <span>Back</span></button>
            <span class="progress" id="quiz-progress">1 of 10</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

          <p class="question" id="question-text"></p>
          <div class="choices" id="choices"></div>

          <div class="quiz-next" id="quiz-next" hidden>
            <button class="btn primary" id="btn-next">Next question →</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ========================= LEXICON SIDEBAR ========================= -->
  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
  <aside class="sidebar" id="lexicon-sidebar" aria-label="Dictionary" hidden>
    <div class="sidebar-head">
      <h2>Dictionary</h2>
      <button class="btn primary" id="btn-new-word">New word</button>
    </div>

    <div class="lexicon-search">
      <div class="search-field">
        <input
          type="search"
          id="search"
          placeholder="Search words…"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="word-list"
          aria-autocomplete="list"
        />
        <button
          type="button"
          class="search-clear"
          id="search-clear"
          aria-label="Clear search"
          hidden
        >
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path
              d="M3 3l6 6M9 3l-6 6"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <ul class="word-list" id="word-list" role="listbox" hidden></ul>
    </div>

    <div class="word-detail" id="word-detail">
      <p class="empty">Search a word to view its definition.</p>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
